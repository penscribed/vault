name: Release

# Push a tag like v1.2.0 (or run manually with a version) to build a signed APK
# and publish it as a GitHub Release. Installed copies of Vault pick it up automatically.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version
        run: |
          RAW="${{ github.event.inputs.version }}"
          if [ -z "$RAW" ]; then RAW="${GITHUB_REF_NAME}"; fi
          VERSION="${RAW#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH="${PATCH:-0}"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Releasing $VERSION (versionCode $CODE)"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is missing. See README > Auto-updates."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vault-release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/vault-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionName="$VERSION" \
            -PversionCode="$VERSION_CODE" \
            -PupdateRepo="${{ github.repository }}" \
            --stacktrace

      - name: Name file and write checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Vault-$VERSION.apk"
          sha256sum "Vault-$VERSION.apk" | cut -d' ' -f1 > "Vault-$VERSION.apk.sha256"
          rm -f "$RUNNER_TEMP/vault-release.jks"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Vault ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            Vault-${{ env.VERSION }}.apk
            Vault-${{ env.VERSION }}.apk.sha256
